<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — 팀 선택</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<header class="bg-white shadow-sm px-6 py-3 flex justify-between items-center">
  <span class="bg-teal-600 text-white font-bold px-3 py-1 rounded">TaskFlow</span>
  <div class="flex items-center gap-4">
    <span id="userEmail" class="text-sm text-gray-600"></span>
    <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-800">로그아웃</button>
  </div>
</header>
<main class="max-w-2xl mx-auto mt-10 px-4">
  <div id="notice" class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded text-blue-700 text-sm">
    ℹ 아직 팀에 소속되지 않았습니다. 팀을 만들거나 초대코드로 합류하세요.
  </div>
  <div id="createSection" class="hidden mb-8 p-6 bg-white rounded-lg shadow-sm">
    <h2 class="text-lg font-semibold mb-2 text-teal-700">✓ 팀이 생성되었습니다!</h2>
    <p class="text-sm text-gray-500 mb-1">팀 이름</p>
    <p id="createdTeamName" class="text-xl font-bold mb-4"></p>
    <p class="text-sm text-gray-500 mb-1">초대코드 (멤버에게 공유)</p>
    <div class="flex items-center gap-2">
      <span id="inviteCode" class="text-2xl font-mono font-bold text-teal-600 tracking-widest border-2 border-teal-300 rounded px-4 py-2"></span>
      <button onclick="copyCode()" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded">📋 복사</button>
    </div>
    <button onclick="location.href='/kanban.html'" class="mt-4 w-full bg-teal-600 text-white py-2 rounded font-semibold hover:bg-teal-700">칸반 시작하기 →</button>
  </div>
  <div class="grid md:grid-cols-2 gap-6">
    <div class="bg-white p-6 rounded-lg shadow-sm">
      <h2 class="text-lg font-semibold mb-4">+ 새 팀 만들기</h2>
      <div id="createError" class="hidden mb-3 text-red-600 text-sm"></div>
      <input id="teamName" type="text" placeholder="팀 이름 (1–30자)" maxlength="30"
        class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-teal-500">
      <button onclick="createTeam()" class="w-full bg-teal-600 text-white py-2 rounded font-semibold hover:bg-teal-700">만들기</button>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-sm">
      <h2 class="text-lg font-semibold mb-4">초대코드로 합류</h2>
      <div id="joinError" class="hidden mb-3 p-2 bg-red-50 border border-red-200 rounded text-red-600 text-sm"></div>
      <!-- Step 1: 코드 입력 -->
      <div id="joinStep1">
        <input id="joinCode" type="text" placeholder="ABCD-1234" maxlength="9"
          class="w-full border border-gray-300 rounded px-3 py-2 mb-1 font-mono text-center tracking-widest text-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
          oninput="this.value=this.value.toUpperCase(); onCodeInput(this.value)">
        <p class="text-xs text-gray-400 mb-3 text-center">형식: 대문자 4 + 숫자 4 (하이픈 포함)</p>
        <button onclick="verifyCode()" id="verifyBtn" class="w-full bg-teal-600 text-white py-2 rounded font-semibold hover:bg-teal-700">확인</button>
      </div>
      <!-- Step 2: 팀 미리보기 -->
      <div id="joinStep2" class="hidden">
        <div class="mb-3 p-3 bg-teal-50 border border-teal-200 rounded text-teal-700 text-sm font-medium">
          ✓ <span id="previewMsg"></span>
        </div>
        <div class="mb-4 p-3 bg-gray-50 rounded border text-sm">
          <p class="font-bold text-base mb-1" id="previewName"></p>
          <p class="text-gray-500" id="previewMeta"></p>
        </div>
        <button onclick="confirmJoin()" class="w-full bg-teal-600 text-white py-2 rounded font-semibold hover:bg-teal-700 mb-2">이 팀에 합류 →</button>
        <button onclick="resetJoin()" class="w-full text-sm text-gray-500 hover:text-gray-700">다시 입력</button>
      </div>
    </div>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  Auth.requireAuth();
  const user = Auth.getUser();
  document.getElementById('userEmail').textContent = user?.email || '';

  async function createTeam() {
    const name = document.getElementById('teamName').value.trim();
    const errEl = document.getElementById('createError');
    errEl.classList.add('hidden');
    if (!name) { errEl.textContent = '팀 이름을 입력하세요'; errEl.classList.remove('hidden'); return; }
    try {
      const data = await api.post('/teams', { name });
      const updatedUser = { ...user, team_id: data.id };
      Auth.save(Auth.getToken(), updatedUser);
      document.getElementById('createSection').classList.remove('hidden');
      document.getElementById('createdTeamName').textContent = data.name;
      document.getElementById('inviteCode').textContent = data.invite_code;
      document.getElementById('notice').classList.add('hidden');
    } catch (err) {
      errEl.textContent = err.data?.error?.message || '팀 생성 중 오류';
      errEl.classList.remove('hidden');
    }
  }

  let pendingTeam = null;

  function onCodeInput(val) {
    document.getElementById('joinError').classList.add('hidden');
  }

  async function verifyCode() {
    const code = document.getElementById('joinCode').value.trim();
    const errEl = document.getElementById('joinError');
    errEl.classList.add('hidden');
    if (!code) return;
    try {
      // Preview: call join API — on success show preview
      const data = await api.post('/teams/join', { invite_code: code });
      const updatedUser = { ...user, team_id: data.team.id };
      Auth.save(Auth.getToken(), updatedUser);
      location.href = '/kanban.html';
    } catch (err) {
      const status = err.status;
      const msg = err.data?.error?.message || '합류 중 오류';
      if (status === 404 || status === 409 || status === 400 || status === 422) {
        errEl.textContent = '⚠ ' + msg;
        errEl.classList.remove('hidden');
        const input = document.getElementById('joinCode');
        input.classList.add('border-red-400');
        setTimeout(() => input.classList.remove('border-red-400'), 2000);
      } else {
        errEl.textContent = '⚠ ' + msg;
        errEl.classList.remove('hidden');
      }
    }
  }

  function confirmJoin() { location.href = '/kanban.html'; }

  function resetJoin() {
    document.getElementById('joinStep1').classList.remove('hidden');
    document.getElementById('joinStep2').classList.add('hidden');
    document.getElementById('joinCode').value = '';
    pendingTeam = null;
  }

  function copyCode() {
    const code = document.getElementById('inviteCode').textContent;
    navigator.clipboard.writeText(code).then(() => alert('복사됨: ' + code));
  }

  function logout() {
    api.post('/auth/logout').finally(() => { Auth.clear(); location.href = '/login.html'; });
  }
</script>
</body>
</html>
