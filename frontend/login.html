<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — 로그인</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
<div class="w-full max-w-sm mx-auto p-6">
  <div class="text-center mb-8">
    <span class="inline-block bg-teal-600 text-white text-xl font-bold px-4 py-2 rounded">TaskFlow</span>
  </div>
  <h1 class="text-2xl font-semibold text-center mb-6">로그인</h1>
  <div id="error" class="hidden mb-4 p-3 bg-red-50 border border-red-300 rounded text-red-700 text-sm"></div>
  <form id="loginForm" class="space-y-4">
    <input id="email" type="email" placeholder="이메일 입력" required
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
    <input id="password" type="password" placeholder="비밀번호" required
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500">
    <button type="submit" id="submitBtn"
      class="w-full bg-teal-600 text-white py-2 rounded font-semibold hover:bg-teal-700 transition disabled:opacity-50">
      로그인
    </button>
  </form>
  <p class="text-center mt-4 text-sm text-gray-500">
    계정이 없으신가요? <a href="/signup.html" class="text-teal-600 hover:underline">회원가입</a>
  </p>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  Auth.requireNoAuth();
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    btn.textContent = '처리 중…'; btn.disabled = true;
    errEl.classList.add('hidden');
    try {
      const data = await api.post('/auth/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      Auth.save(data.token, data.user);
      location.href = data.user.team_id ? '/kanban.html' : '/team.html';
    } catch (err) {
      const msg = err.data?.error?.message || '로그인 중 오류가 발생했습니다';
      errEl.textContent = '✕ ' + msg;
      errEl.classList.remove('hidden');
      btn.textContent = '로그인'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
