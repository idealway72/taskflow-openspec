<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col h-screen">
<header class="bg-white shadow-sm px-4 py-3 flex items-center justify-between flex-shrink-0">
  <div class="flex items-center gap-4">
    <span class="bg-teal-600 text-white font-bold px-3 py-1 rounded">TaskFlow</span>
    <span id="teamName" class="font-semibold text-gray-700 hidden md:inline"></span>
  </div>
  <nav class="flex gap-1">
    <button onclick="location.href='/kanban.html'" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded text-sm">칸반</button>
    <button onclick="location.href='/chat.html'" class="px-3 py-1 bg-teal-600 text-white rounded text-sm font-semibold">채팅</button>
    <button onclick="location.href='/kanban.html'" class="px-3 py-1 text-gray-600 hover:bg-gray-100 rounded text-sm">멤버</button>
  </nav>
  <div class="flex items-center gap-3">
    <span id="pollStatus" class="text-xs text-teal-500">● 5초마다 새로고침</span>
    <button onclick="logout()" class="text-sm text-gray-400 hover:text-gray-700">로그아웃</button>
  </div>
</header>

<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

<div class="flex-shrink-0 bg-white border-t p-3">
  <div class="flex items-end gap-2 max-w-4xl mx-auto">
    <div class="flex-1">
      <textarea id="msgInput" placeholder="메시지 입력 (1000자 이내)…" maxlength="1010" rows="2"
        class="w-full border border-gray-300 rounded px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-teal-500"
        oninput="onInput()" onkeydown="onKey(event)"></textarea>
      <div class="flex justify-between mt-1">
        <span id="charCount" class="text-xs text-gray-400">0 / 1000</span>
        <span id="overLimit" class="hidden text-xs text-red-500"></span>
      </div>
    </div>
    <button id="sendBtn" onclick="sendMessage()"
      class="bg-teal-600 text-white px-4 py-2 rounded font-semibold hover:bg-teal-700 disabled:opacity-40 transition h-10">
      전송
    </button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
